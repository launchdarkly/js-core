version: 2
updates:
  # GitHub Actions — no cooldown for our own actions, 7 days for third-party
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/actions/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  # npm — examples and contract-tests only (directories with lockfiles)
  - package-ecosystem: 'npm'
    directories:
      - 'packages/sdk/*/example'
      - 'packages/sdk/*/example-*'
      - 'packages/sdk/*/examples/*'
      - 'packages/sdk/*/examples/*/*'
      - 'packages/sdk/*/examples/*/*/*'
      - 'packages/sdk/*/contract-tests'
      - 'packages/sdk/*/contract-tests/*'
      - 'packages/tooling/jest/example/*'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - '*'
        group-by: dependency-name
    ignore:
      - dependency-name: 'typescript'
      - dependency-name: '@types/*'
        update-types: ['version-update:semver-major']
