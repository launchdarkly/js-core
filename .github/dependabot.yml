version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories:
      - "packages/sdk/*/example"
      - "packages/sdk/*/example-*"
      - "packages/sdk/*/examples/*"
      - "packages/sdk/*/examples/*/*"
      - "packages/sdk/*/examples/*/*/*"
      - "packages/sdk/*/contract-tests"
      - "packages/sdk/*/contract-tests/*"
      - "packages/tooling/jest/example/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "typescript"
