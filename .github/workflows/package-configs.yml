name: package-configs

# Packs every released package and tests the tarballs in consumer projects with many build
# configurations. See scripts/package-config-tests/README.md.

on:
  push:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/setup-yarn
      - name: Install dependencies
        run: yarn workspaces focus $(node scripts/released-packages.js)
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build released packages
        run: yarn workspaces foreach -pR --topological-dev $(node scripts/released-packages.js | sed 's/^/--from /') run build
      - name: Pack released packages
        run: node scripts/package-config-tests/run.js pack --packs ${{ runner.temp }}/packs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packs
          path: ${{ runner.temp }}/packs
          retention-days: 7

  test:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ['types:5.0.4', 'types:5.9.3', 'types:6.0.3', attw, runtime, cloudflare, vercel]
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/setup-yarn
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: ${{ runner.temp }}/packs
      - name: Run ${{ matrix.suite }}
        run: >
          node scripts/package-config-tests/run.js '${{ matrix.suite }}'
          --work ${{ runner.temp }}/work --packs ${{ runner.temp }}/packs
