name: sdk/openfeature-cloudflare-server

on:
  push:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md' #Do not need to run CI for markdown changes.
  pull_request:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md'

jobs:
  build-test-openfeature-cloudflare-server:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node versions to run on. Matches this package's own "engines" field (>=22).
        version: [22]

    steps:
      - uses: actions/checkout@v7
      - uses: $/actions/setup-yarn
        with:
          node-version: ${{ matrix.version }}
          registry-url: 'https://registry.npmjs.org'
      - id: shared
        name: Shared CI Steps
        uses: $/actions/ci
        with:
          workspace_name: '@launchdarkly/openfeature-cloudflare-server'
          workspace_path: packages/sdk/openfeature-cloudflare-server

  build-test-openfeature-cloudflare-server-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/actions/setup-yarn
      - name: Install Dependencies
        run: yarn workspaces focus @launchdarkly/hello-openfeature-cloudflare-server
      - name: Install Playwright browsers
        run: yarn workspace @launchdarkly/hello-openfeature-cloudflare-server playwright install --with-deps chromium
      - name: Build
        run: yarn workspaces foreach -pR --topological-dev --from '@launchdarkly/hello-openfeature-cloudflare-server' run build
      - name: Lint
        run: yarn workspace @launchdarkly/hello-openfeature-cloudflare-server lint
      - name: Format Check
        run: yarn workspace @launchdarkly/hello-openfeature-cloudflare-server format:check
      - name: Test
        run: yarn workspace @launchdarkly/hello-openfeature-cloudflare-server test
