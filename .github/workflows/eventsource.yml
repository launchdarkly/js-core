name: shared/eventsource

on:
  push:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md' #Do not need to run CI for markdown changes.
  pull_request:
    branches: [main, 'feat/**']
    paths-ignore:
      - '**.md'

jobs:
  build-test-eventsource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./actions/setup-yarn
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - id: shared
        name: Shared CI Steps
        uses: ./actions/ci
        with:
          workspace_name: '@launchdarkly/eventsource'
          workspace_path: packages/shared/eventsource
      - name: Install contract-tests dependencies
        run: yarn workspaces focus @launchdarkly/eventsource-contract-tests
      - name: Build the contract-tests service
        run: yarn workspace @launchdarkly/eventsource-contract-tests build
      - name: Launch the contract-tests service in the background
        run: |
          yarn workspace @launchdarkly/eventsource-contract-tests start \
            > /tmp/eventsource-contract-tests.log 2>&1 &
      - name: Run SSE contract tests
        uses: launchdarkly/gh-actions/actions/contract-tests@contract-tests-v1
        with:
          repo: sse-contract-tests
          version: v2
          branch: main
          test_service_port: 8000
          token: ${{ secrets.GITHUB_TOKEN }}
          enable_persistence_tests: 'false'
      - name: Print contract-tests service log on failure
        if: failure()
        run: cat /tmp/eventsource-contract-tests.log || echo "No contract-tests service log"
