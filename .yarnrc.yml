approvedGitRepositories:
  - '**'

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 4320

# Exempt this first-party package from the minimum-age gate so freshly published
# versions install without waiting it out. Exact name (not a glob) so it cannot
# match an attacker-squatted launchdarkly-* package.
npmPreapprovedPackages:
  - 'launchdarkly-eventsource'

npmPublishAccess: public

npmScopes:
  jsr:
    npmRegistryServer: 'https://npm.jsr.io'

yarnPath: .yarn/releases/yarn-4.15.0.cjs
